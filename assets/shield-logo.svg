<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#0077ff" />
      <stop offset="100%" stop-color="#00ff66" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-bright" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Cyber Ring -->
  <circle cx="100" cy="110" r="95" fill="none" stroke="rgba(0, 240, 255, 0.15)" stroke-width="1.5" stroke-dasharray="6, 8" />
  <circle cx="100" cy="110" r="88" fill="none" stroke="rgba(0, 255, 102, 0.2)" stroke-width="1" />

  <!-- Shield Outer Geometry -->
  <polygon points="100,18 178,54 178,124 100,198 22,124 22,54" 
           fill="rgba(10, 20, 38, 0.75)" 
           stroke="url(#shieldGrad)" 
           stroke-width="3" 
           filter="url(#glow)" />

  <!-- Inner Tech Facets -->
  <polygon points="100,32 162,62 162,120 100,182 38,120 38,62" 
           fill="none" 
           stroke="rgba(0, 240, 255, 0.4)" 
           stroke-width="1.5" 
           stroke-dasharray="4, 4" />

  <!-- Center Circuit Pattern -->
  <path d="M100,45 L100,100 M65,80 L100,100 L135,80 M100,100 L100,165 M75,140 L100,125 L125,140" 
        stroke="url(#coreGrad)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        fill="none" 
        filter="url(#glow)" />

  <!-- Terminal Nodes -->
  <circle cx="100" cy="100" r="5" fill="#00ff66" filter="url(#glow-bright)" />
  <circle cx="65" cy="80" r="3.5" fill="#00f0ff" />
  <circle cx="135" cy="80" r="3.5" fill="#00f0ff" />
  <circle cx="75" cy="140" r="3.5" fill="#00f0ff" />
  <circle cx="125" cy="140" r="3.5" fill="#00f0ff" />
  <circle cx="100" cy="45" r="3.5" fill="#00ff66" />
  <circle cx="100" cy="165" r="3.5" fill="#00ff66" />

  <!-- Top Accent Triangles -->
  <polygon points="95,12 105,12 100,2" fill="#00f0ff" />
</svg>
